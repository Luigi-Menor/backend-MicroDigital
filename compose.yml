services:
  db:
    image: postgres:16-alpine
    container_name: solobackend_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - microdigital_pgdata:/var/lib/postgresql/data

volumes:
  microdigital_pgdata:
